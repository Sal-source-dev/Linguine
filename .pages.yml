# Configuration de Pages CMS : les formulaires de linguine.
media:
  input: assets/images
  output: /assets/images

content:
  - name: langues
    label: Langues
    type: collection
    path: contenus/langues
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [langues.11tydata.js]
    view:
      fields: [nom, type, parent, statut]
      primary: nom
    fields:
      - name: nom
        label: Nom
        type: string
        description: "En minuscules (ex. : latin, vieux slave). C'est ce nom qu'on choisit ensuite dans les autres formulaires."
      - name: type
        label: Type
        type: select
        options:
          values: [langue, branche, famille]
      - name: parent
        label: Langue ou branche mère
        description: "Ce qui place la langue dans l'arbre (ex. : le latin pour le français). Vide pour une grande famille."
        type: reference
        options:
          collection: langues
          value: "{primary}"
          label: "{primary}"
          search: nom
      - name: statut
        label: Statut
        type: select
        options:
          values: [vivante, morte, langue savante, reconstruite]
      - name: ecriture
        label: Écriture
        type: string
      - name: debut
        label: Début (année)
        type: number
        description: "Première attestation ou apparition. Négatif = avant J.-C. (ex. : -600)."
      - name: fin
        label: Fin (année)
        type: number
        description: "Vide si la langue est toujours parlée. Pour une langue savante : la fin de son usage comme langue maternelle."
      - name: dates_approximatives
        label: Dates approximatives
        type: boolean
      - name: region
        label: Où on la parle (ou parlait)
        type: string
      - name: latitude
        label: Latitude
        type: number
        description: "Pour la carte. Dans Plans, touche longuement un lieu : les coordonnées s'affichent (ex. : 41.9)."
      - name: longitude
        label: Longitude
        type: number
        description: "Ex. : 12.5 pour Rome. Négatif = à l'ouest de Greenwich."
      - name: locuteurs
        label: Locuteurs
        type: string
      - name: resume
        label: Résumé
        type: text
        description: "Deux ou trois phrases, affichées sur l'atlas et en haut de la page."
      - name: body
        label: Mes notes
        type: rich-text
        options:
          format: markdown

  - name: mots
    label: Mots voyageurs
    type: collection
    path: contenus/mots
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [mots.11tydata.js]
    view:
      fields: [mot, langue, langue_arrivee, date]
      primary: mot
    fields:
      - name: mot
        label: Mot
        type: string
      - name: langue
        label: Langue de départ
        description: "La langue d'où vient le mot. Elle doit d'abord exister dans « Langues »."
        type: reference
        options:
          collection: langues
          value: "{primary}"
          label: "{primary}"
          search: nom
      - name: langue_arrivee
        label: Langue d'arrivée
        description: "La langue qui a emprunté le mot (français par défaut)."
        type: reference
        options:
          collection: langues
          value: "{primary}"
          label: "{primary}"
          search: nom
      - name: etymon
        label: Étymon
        type: string
        description: "La forme d'origine. *Astérisques* = italique."
      - name: sens_etymon
        label: Sens de l'étymon
        type: string
      - name: entree
        label: Date d'entrée dans la langue d'arrivée
        type: string
        description: "Ex. : XVIIᵉ siècle"
      - name: date
        label: Date de la fiche
        type: date
        options:
          format: yyyy-MM-dd
      - name: accroche
        label: Accroche
        type: string
        description: "Une phrase courte, affichée dans les listes."
      - name: resume
        label: Résumé
        type: text
        description: "Deux ou trois phrases, sous le titre de la fiche."
      - name: parcours
        label: Parcours
        type: object
        list: true
        description: "Une route par chemin suivi. Ajoute une seconde route si le mot est arrivé par deux voies."
        fields:
          - name: titre
            label: Titre de la route
            type: string
          - name: etapes
            label: Étapes
            type: object
            list: true
            fields:
              - name: langue
                label: Langue
                type: string
              - name: forme
                label: Forme
                type: string
      - name: body
        label: Glissements de sens
        type: rich-text
        options:
          format: markdown
      - name: anecdote
        label: Le détail qui m'a plu
        type: text
      - name: cousins
        label: Cousins ailleurs
        type: object
        list: true
        fields:
          - name: langue
            label: Langue
            type: string
          - name: formes
            label: Formes
            type: string
      - name: sources
        label: Sources
        type: string
        list: true
      - name: modele
        label: Afficher le badge « Modèle à remplacer »
        type: boolean

  - name: lectures
    label: Carnet de lectures
    type: collection
    path: contenus/lectures
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [lectures.11tydata.json]
    view:
      fields: [titre, auteur, statut, date]
      primary: titre
    fields:
      - name: titre
        label: Titre du livre
        type: string
      - name: auteur
        label: Autrice ou auteur
        type: string
      - name: annee
        label: Année de parution
        type: string
      - name: date
        label: Date de la note
        type: date
        options:
          format: yyyy-MM-dd
      - name: statut
        label: Statut
        type: select
        options:
          values: [en cours, lu]
      - name: retiens
        label: Ce que je retiens
        type: text
      - name: passage
        label: Un passage à garder
        type: text
      - name: page_passage
        label: Page du passage
        type: string
      - name: questions
        label: Questions ouvertes
        type: text
      - name: mots
        label: Mots à suivre
        type: string
        list: true
        description: "Si une fiche existe pour ce mot, il devient un lien vers elle."
      - name: langues
        label: Langues concernées
        description: "La note apparaîtra sur la page de ces langues."
        type: reference
        options:
          collection: langues
          value: "{primary}"
          label: "{primary}"
          search: nom
          multiple: true
      - name: themes
        label: Thèmes
        type: string
        list: true
      - name: modele
        label: Afficher le badge « Modèle à remplacer »
        type: boolean

  - name: articles
    label: Articles
    type: collection
    path: contenus/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [articles.11tydata.js]
    view:
      fields: [titre, theme, date]
      primary: titre
    fields:
      - name: titre
        label: Titre
        type: string
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: theme
        label: Thématique
        type: string
      - name: langues
        label: Langues concernées
        description: "L'article apparaîtra sur la page de ces langues."
        type: reference
        options:
          collection: langues
          value: "{primary}"
          label: "{primary}"
          search: nom
          multiple: true
      - name: chapeau
        label: Chapeau
        type: text
        description: "Deux lignes pour donner envie de lire la suite."
      - name: body
        label: Texte
        type: rich-text
        options:
          format: markdown
      - name: modele
        label: Afficher le badge « Modèle à remplacer »
        type: boolean

  - name: reglages
    label: Réglages du site
    type: file
    path: _data/reglages.json
    format: json
    fields:
      - name: nom_site
        label: Nom du site
        type: string
      - name: surtitre
        label: Surtitre de l'accueil
        type: string
      - name: accroche
        label: Grand titre de l'accueil
        type: string
      - name: presentation
        label: Présentation (accueil)
        type: text
      - name: mot_du_moment
        label: Mot du moment
        type: string
        description: "Écris le mot exactement comme dans sa fiche (ex. : café)."
      - name: intro_langues
        label: Introduction de l'Atlas des langues
        type: text
      - name: intro_mots
        label: Introduction des Mots voyageurs
        type: text
      - name: intro_lectures
        label: Introduction du Carnet de lectures
        type: text
      - name: intro_articles
        label: Introduction des Articles
        type: text
      - name: apropos
        label: Texte de la page À propos
        type: text
      - name: nom_explication
        label: Encadré « Le nom »
        type: text
      - name: pile
        label: Sur ma pile
        type: object
        list: true
        fields:
          - name: titre
            label: Titre
            type: string
          - name: auteur
            label: Autrice ou auteur
            type: string
      - name: pied_de_page
        label: Pied de page
        type: string
